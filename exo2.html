<body>
    <header>

    <main>
        <section id="top">
<hr>
        <h1>My courses</h1>
        <table border="1">
            <tr>
                <th>course </th>
                <th>teacher</th>
                <th>duration</th>
                <th>status</th>
            </tr>
            <tr>
                <td>html</td>
                <td>amine</td>
                <td>20hours</td>
                <td>completed</td>
            </tr>
            <tr>
                <td>css</td>
                <td>sarah</td>
                <td>25hours</td>
                <td>in progress</td>
            </tr>
            <tr>
                <td>javascript</td>
                <td>yacine</td>
                <td>40hours</td>

             <tr>
                <td>react</td>

                <td>30hours</td>
                <td>not started</td>

                </tr>
            </tr>

        </table>

        </section>
        <hr>
        <h1>contact me</h1>
        <form action="">
            <label for="name">your name</label><br>
            <input type="text" id="name" placeholder="enter your name"><br>
            <label for="last name">enteryour last name</label><br>
            <input type="last name" id="last name" placeholder="enter your last name"><br>
            <label for="email">inter your email</label><br>
            <input type="email" id="email" placeholder="enter your email"><br>
            <label for="password">enter your password</label><br>
            <input type="password" id="password" placeholder="enter your password"><br>
            <label for="phone number">enter your phone number</label><br>
            <input type="number" id="phone number" placeholder="enter your phone number"><br>
            <label for="birthday">enter your birthday</label><br>
            <input type="date" id="birthday" placeholder="enter your birthday"><br>
            <p>gender:</p>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">female</label>
            <p>choose your courses:</p>
            <input type="checkbox" id="html" name="courses" value="html">
            <label for="html">HTML</label>
            <input type="checkbox" id="css" name="courses" value="css">
            <label for="css">CSS</label>
            <input type="checkbox" id="javascript" name="courses" value="javascript">
            <label for="javascript">JavaScript</label>
            <p>country:</p>
            <select name="country" id="country">
                <option value="" disabled selected>Choose your country</option>
                <option value="usa">USA</option>
                <option value="canada">Canada</option>
                <option value="uk">UK</option>
                <option value="germany">Germany</option>
            </select>
            <p>your message:</p>
            <textarea name="message" id="message" cols="30" rows="10" placeholder="enter your message"></textarea> <br><br>
            
            <button type="submit">send</button>
            <button type="reset">reset</button><br>
        </form>
        </main>

        <footer>
